services:
  mongodb:
    image: mongo:latest
    container_name: gwent_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  restheart:
    image: softinstigate/restheart:latest
    container_name: gwent_restheart
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

volumes:
  mongo_data: